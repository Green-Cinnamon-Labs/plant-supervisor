---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: plants.supervision.greenlabs.io
spec:
  group: supervision.greenlabs.io
  names:
    kind: Plant
    listKind: PlantList
    plural: plants
    singular: plant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.activePolicy
      name: Policy
      type: string
    - jsonPath: .status.cost.value
      name: Cost
      type: number
    - jsonPath: .status.cost.unit
      name: Unit
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plant is an industrial plant observed by the supervisory layer.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlantSpec points the operator at a plant's historian and
              at the policy currently in force.
            properties:
              evaluationIntervalSeconds:
                default: 30
                description: EvaluationIntervalSeconds is how often the plant is evaluated.
                format: int32
                minimum: 1
                type: integer
              historianURL:
                description: HistorianURL is the base URL of the historian (e.g. "http://tep-historian:8090").
                minLength: 1
                type: string
              policyRef:
                description: PolicyRef names the active OperatingPolicy in the same
                  namespace.
                minLength: 1
                type: string
            required:
            - historianURL
            - policyRef
            type: object
          status:
            description: PlantStatus is the supervisory layer's verdict about the
              plant.
            properties:
              activePolicy:
                description: ActivePolicy is the policy the verdict refers to.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveViolations:
                description: ConsecutiveViolations counts consecutive failing evaluations
                  under ActivePolicy.
                format: int32
                type: integer
              constraints:
                items:
                  description: ConstraintResult is the outcome of one SignalConstraint.
                  properties:
                    observed:
                      type: number
                    satisfied:
                      type: boolean
                    signal:
                      type: string
                  required:
                  - satisfied
                  - signal
                  type: object
                type: array
              cost:
                description: CostStatus is the evaluated value of J.
                properties:
                  maxCost:
                    type: number
                  reference:
                    type: number
                  unit:
                    type: string
                  value:
                    type: number
                required:
                - unit
                - value
                type: object
              lastEvaluationTime:
                format: date-time
                type: string
              phase:
                description: PlantPhase summarizes the verdict.
                enum:
                - Pending
                - Compliant
                - NonCompliant
                type: string
              targets:
                items:
                  description: TargetResult is the outcome of one SignalTarget.
                  properties:
                    met:
                      type: boolean
                    observed:
                      type: number
                    signal:
                      type: string
                    target:
                      type: number
                  required:
                  - met
                  - signal
                  - target
                  type: object
                type: array
              terms:
                items:
                  description: TermContribution is one term's share of J.
                  properties:
                    name:
                      type: string
                    value:
                      type: number
                  required:
                  - name
                  - value
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
